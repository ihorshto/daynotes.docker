name: daynotes

services:
  daynotes.sgbd:
    build:
      context: ./daynotes.sgbd/
      dockerfile: Dockerfile
    container_name: sgbd
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:${DB_PORT}:${DB_PORT}"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}" ]
      interval: 5s
      timeout: 30s
      retries: 10
    networks:
      - app-network

  daynotes.api:
    build:
      context: ./daynotes.api/
      dockerfile: Dockerfile
      args:
        uid: ${UID:-1000}
    container_name: api
    environment:
      - APACHE_RUN_USER=#${UID:-1000}
      - APACHE_RUN_GROUP=#${UID:-1000}
      - DOMAIN=${DOMAIN}
      - TZ=Europe/Paris
    volumes:
      - ./daynotes.api/web:/var/www/html
      - laravel_storage:/var/www/html/storage/app/public
      - ./daynotes.api/config/sites-available/000-default.conf:/etc/apache2/sites-available/000-default.conf
      - ./daynotes.api/config/ports.conf:/etc/apache2/ports.conf
      - letsencrypt_certs:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      daynotes.sgbd:
        condition: service_healthy
    restart: always
    entrypoint: sh -c "chmod +x /var/www/html/onLaunch.sh && /var/www/html/onLaunch.sh && apache2-foreground"
    networks:
      - app-network

  daynotes.listener:
    build:
      context: ./daynotes.listener/
      dockerfile: Dockerfile
      args:
        uid: ${UID:-1000}
    container_name: listener
    environment:
      - TZ=Europe/Paris
    volumes:
      - ./daynotes.api/web:/var/www/html
    depends_on:
      daynotes.sgbd:
        condition: service_healthy
    restart: always
    networks:
      - app-network

  n8n:
    image: n8nio/n8n
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - DB_TYPE=mysqldb
      - DB_MYSQLDB_HOST=daynotes.sgbd
      - DB_MYSQLDB_PORT=3306
      - DB_MYSQLDB_DATABASE=${DB_NAME}
      - DB_MYSQLDB_USER=${DB_USER}
      - DB_MYSQLDB_PASSWORD=${DB_PASSWORD}
      - N8N_SECURE_COOKIE=false
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - daynotes.sgbd
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  laravel_storage:
    driver: local
  letsencrypt_certs:
    driver: local
  n8n_data:
    driver: local