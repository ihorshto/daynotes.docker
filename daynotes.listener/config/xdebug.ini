zend_extension=xdebug

[xdebug]
; Xdebug mode - controlled by environment variable
; Options: off, develop, debug, coverage, profile, trace
xdebug.mode=${XDEBUG_MODE}

; Client host - the IP where the IDE is running
; "host.docker.internal" works for Docker Desktop (Mac/Windows)
xdebug.client_host=${XDEBUG_CLIENT_HOST}

; Default port for Xdebug 3 (9003)
xdebug.client_port=${XDEBUG_CLIENT_PORT}

; Start debugging automatically without requiring a trigger
xdebug.start_with_request=${XDEBUG_START_WITH_REQUEST}

; IDE key for session identification
xdebug.idekey=${XDEBUG_IDEKEY}

; Enable logging for troubleshooting
xdebug.log=/var/log/xdebug.log
xdebug.log_level=3

; Discover client host automatically
xdebug.discover_client_host=false

; Maximum nesting level for function calls
xdebug.max_nesting_level=512