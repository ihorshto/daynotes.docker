name: daynotes

services:
  daynotes.sgbd:
    build:
      context: ./daynotes.sgbd/
      dockerfile: Dockerfile
    container_name: daynotes.sgbd
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - './daynotes.sgbd/db:/var/lib/mysql'
    ports:
      - ${DB_PORT}:${DB_PORT}
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -P ${DB_PORT} -p${DB_ROOT_PASSWORD} | grep 'mysqld is alive' || exit 1" ]
      interval: 5s
      timeout: 30s
      retries: 10
    networks:
      - app-network

  daynotes.test-db:
    image: mysql:8.0
    container_name: daynotes.test-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: test_root_password
      MYSQL_DATABASE: test_daynotes
      MYSQL_USER: test_user
      MYSQL_PASSWORD: test_password
    volumes:
      - './daynotes.test-db/db:/var/lib/mysql'
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -p'test_root_password' | grep 'mysqld is alive' || exit 1"]
      interval: 5s
      timeout: 30s
      retries: 10

  app:
    container_name: daynotes.app
    build:
      context: ./daynotes.api/
      dockerfile: Dockerfile
      args:
        uid: ${UID:-1000}
    environment:
      - DOMAIN=${DOMAIN}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - TZ=${TZ}
      # Xdebug Configuration
      - XDEBUG_MODE=${XDEBUG_MODE:-off}
      - XDEBUG_CLIENT_HOST=${XDEBUG_CLIENT_HOST:-host.docker.internal}
      - XDEBUG_CLIENT_PORT=${XDEBUG_CLIENT_PORT:-9003}
      - XDEBUG_START_WITH_REQUEST=${XDEBUG_START_WITH_REQUEST:-yes}
      - XDEBUG_IDEKEY=${XDEBUG_IDEKEY:-PHPSTORM}
    volumes:
      - ./daynotes.api/web:/var/www/html
    ports:
      - "8000:80"
    depends_on:
      daynotes.sgbd:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  daynotes.listener:
    container_name: daynotes.listener
    build:
      context: ./daynotes.listener/
      dockerfile: Dockerfile
      args:
        uid: ${UID:-1000}
    environment:
      - TZ=${TZ}
      # Xdebug Configuration
      - XDEBUG_MODE=${XDEBUG_MODE:-off}
      - XDEBUG_CLIENT_HOST=${XDEBUG_CLIENT_HOST:-host.docker.internal}
      - XDEBUG_CLIENT_PORT=${XDEBUG_CLIENT_PORT:-9003}
      - XDEBUG_START_WITH_REQUEST=${XDEBUG_START_WITH_REQUEST:-yes}
      - XDEBUG_IDEKEY=${XDEBUG_IDEKEY:-PHPSTORM}
    volumes:
      - ./daynotes.api/web:/var/www/html
    depends_on:
      daynotes.sgbd:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  daynotes.cron:
    container_name: daynotes.cron
    build:
      context: ./daynotes.cron/
      dockerfile: Dockerfile
    environment:
      - TZ=${TZ}
    volumes:
      - ./daynotes.api/web:/var/www/html
    depends_on:
      daynotes.sgbd:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  n8n:
    image: n8nio/n8n
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - DB_TYPE:mysqldb
      - DB_MYSQLDB_HOST=daynotes.sgbd
      - DB_MYSQLDB_PORT=3306
      - DB_MYSQLDB_DATABASE=${DB_NAME}
      - DB_MYSQLDB_USER=${DB_USER}
      - DB_MYSQLDB_PASSWORD=${DB_PASSWORD}
    depends_on:
      - daynotes.sgbd
    networks:
      - app-network

networks:
  app-network:
    driver: bridge